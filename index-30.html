<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIMBA Enumerator Tracker</title>
  <link rel="icon" type="image/png" href="assets/rimba-logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{
      --forest:#355b38;
      --olive:#71834d;
      --mist:#f4f6ef;
      --ink:#18301d;
      --line:#dce4d4;
      --white:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:var(--mist);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:flex}
    .sidebar{
      display:none;
      width:235px;
      background:#294c30;
      color:white;
      padding:22px 14px;
      flex-direction:column;
      position:sticky;
      top:0;
      height:100vh;
    }
    .main{width:100%;padding-bottom:80px}
    header{
      background:white;
      border-bottom:1px solid var(--line);
    }
    .header-inner,.page{
      max-width:1100px;
      margin:auto;
      padding:18px 16px;
    }
    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    h1{margin:0;font-size:1.55rem;line-height:1.08;letter-spacing:-.035em;font-weight:800}
    .brand-title{color:var(--ink);display:block}
    .brand-title::first-letter{color:var(--forest)}
    .brand-subtitle{margin-top:7px;font-size:.82rem}
    h2{margin:0;font-size:1rem}
    p{margin:0}
    .muted{color:#617065}
    .tiny{font-size:.78rem}
    .card{
      background:white;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      box-shadow:0 2px 8px rgba(23,51,27,.04);
    }
    .grid{display:grid;gap:12px}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }
    .primary,.secondary{
      border-radius:12px;
      padding:11px 14px;
      font-weight:700;
    }
    .primary{
      background:var(--forest);
      color:white;
      border:0;
    }
    .secondary{
      background:white;
      color:var(--forest);
      border:1px solid #b8c6ad;
    }
    .field{
      width:100%;
      border:1px solid #cbd6c4;
      border-radius:10px;
      padding:11px;
      background:white;
      color:var(--ink);
    }
    label{
      display:block;
      font-size:.78rem;
      font-weight:700;
      margin-bottom:6px;
    }
    .stat-card{display:flex;align-items:center;gap:12px;min-height:104px}
    .stat-icon,.category-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
    .stat-icon svg,.category-icon svg{width:23px;height:23px}
    .stat-icon.green{background:#e8f1e4;color:#355b38}
    .stat-icon.olive{background:#edf0e5;color:#71834d}
    .stat-icon.amber{background:#f7efe0;color:#9a6a22}
    .stat-icon.gray{background:#eef0ed;color:#68726a}
    .stat-icon.blue{background:#e7f1f4;color:#2e7180}
    .stat-value{display:block;font-size:1.35rem;margin-top:3px}
    .category-row{display:flex;align-items:center;gap:11px;padding:7px 0}
    .category-main{flex:1;min-width:0}
    .category-icon{width:38px;height:38px;border-radius:12px;background:#eef4e9;color:var(--forest)}
    .category-icon svg{width:20px;height:20px}
    .nav-icon{width:22px;height:22px;display:block}
    .navbtn.active .nav-icon{stroke-width:2.4}
    .brand-wrap{display:flex;align-items:center;gap:12px}
    .bar{
      height:9px;
      border-radius:99px;
      background:#e7ebdf;
      overflow:hidden;
    }
    .bar span{
      display:block;
      height:100%;
      background:var(--forest);
      border-radius:inherit;
    }
    .badge{
      display:inline-flex;
      padding:4px 9px;
      border-radius:999px;
      font-size:.72rem;
      font-weight:700;
    }
    .done{background:#e4f2e1;color:#285a30}
    .pending{background:#f4eee1;color:#8a5d16}
    .off{background:#edf0e8;color:#526250}
    .online{background:#e3f0f1;color:#22636a}
    .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .filter-grid .field{min-width:0;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .custom-select{position:relative;width:100%;}
    .custom-select-button{width:100%;min-height:46px;border:1px solid #cbd6c4;border-radius:12px;padding:11px 42px 11px 13px;background:#fff;color:var(--ink);text-align:left;position:relative;transition:.15s ease;}
    .custom-select-button:hover{border-color:#aebda5;background:#fbfcfa}
    .custom-select.open .custom-select-button{border-color:var(--forest);box-shadow:0 0 0 3px rgba(53,91,56,.08)}
    .custom-select-button .select-chevron{position:absolute;right:13px;top:50%;width:9px;height:9px;border-right:1.8px solid #5e6b60;border-bottom:1.8px solid #5e6b60;transform:translateY(-65%) rotate(45deg);transition:.15s}
    .custom-select.open .select-chevron{transform:translateY(-25%) rotate(225deg)}
    .custom-select-menu{position:absolute;z-index:100;left:0;right:0;top:calc(100% + 6px);display:none;max-height:260px;overflow:auto;background:#fff;border:1px solid #cbd6c4;border-radius:14px;padding:6px;box-shadow:0 12px 30px rgba(24,48,29,.15)}
    .custom-select.open .custom-select-menu{display:block}
    .custom-option{width:100%;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:11px 12px;text-align:left;font-size:.92rem;line-height:1.25}
    .custom-option:hover{background:#eef4e9}
    .custom-option.selected{background:#e8f1e4;color:var(--forest);font-weight:700}
    .custom-option.disabled{opacity:.45;cursor:not-allowed}
    .custom-option .option-meta{display:block;font-size:.7rem;color:#758076;margin-top:3px;font-weight:500}
    .form-section{border:1px solid #e1e8dd;border-radius:15px;padding:14px;background:#fbfcfa}
    .form-section-title{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:800;color:var(--forest);margin-bottom:12px}
    .form-section-title .section-icon{width:30px;height:30px;border-radius:10px;background:#e8f1e4;display:grid;place-items:center;flex:none}
    .form-section-title svg{width:17px;height:17px}
    .form-grid{display:grid;gap:12px}
    .form-grid.two{grid-template-columns:1fr 1fr}
    .form-actions{position:sticky;bottom:70px;z-index:10;background:linear-gradient(to bottom,rgba(244,246,239,0),var(--mist) 18%);padding-top:14px}
    .doc-upload{margin-top:2px}
    .doc-upload-label{min-height:76px;padding:4px}
    .doc-upload-icon{width:46px;height:46px}
    .doc-upload-copy{min-width:0}
    .doc-upload-copy b{display:block;font-size:.9rem}
    .doc-upload-copy .muted{display:block;margin-top:4px}
    @media(max-width:430px){.form-grid.two{grid-template-columns:1fr 1fr;gap:9px}.form-section{padding:12px}.custom-select-menu{max-height:235px}}
    @media(max-width:390px){
      .filter-grid{grid-template-columns:1fr;}
      .filter-grid .field{font-size:.92rem;}
    }
    .setup-banner{display:flex;align-items:center;gap:12px;background:#eef5e9;border:1px solid #d9e7d2;border-radius:14px;padding:12px 14px;color:#355b38;}
    .setup-banner .setup-icon{width:36px;height:36px;border-radius:11px;background:#dfeedd;display:grid;place-items:center;flex:none;}
    .setup-banner .setup-icon svg{width:20px;height:20px;}
    .respondent{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:white;
      border-radius:14px;
      padding:14px;
    }
    .bottom-nav{
      position:fixed;
      z-index:20;
      bottom:0;
      left:0;
      right:0;
      background:white;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-around;
      padding:7px 5px;
    }
    .navbtn{
      border:0;
      background:transparent;
      color:#667267;
      padding:6px;
      font-size:.68rem;
      display:grid;
      gap:3px;
      place-items:center;
    }
    .navbtn.active{color:var(--forest);font-weight:700}
    .toast{
      position:fixed;
      z-index:40;
      top:16px;
      left:50%;
      transform:translateX(-50%);
      background:#17381e;
      color:white;
      padding:11px 15px;
      border-radius:10px;
      display:none;
    }
    .toast.show{display:block}
    .photo{
      width:80px;
      height:80px;
      border-radius:10px;
      object-fit:cover;
      border:1px solid var(--line);
    }
    .doc-upload{
      border:1px dashed #b8c8b0;
      background:#f7faf4;
      border-radius:14px;
      padding:14px;
    }
    .doc-upload-label{
      display:flex;align-items:center;gap:11px;cursor:pointer;margin:0;
    }
    .doc-upload-icon{
      width:40px;height:40px;border-radius:12px;background:#e7f0e2;color:var(--forest);
      display:grid;place-items:center;flex:none;
    }
    .doc-upload-icon svg{width:21px;height:21px}
    .photo-grid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;margin-top:12px}
    .photo-wrap{position:relative;width:80px;height:80px}
    .photo-wrap .photo{display:block}
    .photo-count{font-size:.72rem;color:#617065;margin-top:7px}
    @media(max-width:390px){.photo-grid{grid-template-columns:repeat(3,80px)}}
    .logo{
      width:40px;
      height:40px;
      border-radius:11px;
      background:#eef4e8;
      display:grid;
      place-items:center;
      flex:none;
    }
    .logo img{width:29px;height:29px;display:block;object-fit:contain;border-radius:8px}
    @media(max-width:430px){
      .header-inner{padding-top:16px;padding-bottom:16px}
      .local-status{min-height:36px;padding:6px 10px;gap:6px}
      .local-icon{display:none}
    }

    /* Mobile-first: profile/settings layout stays inside the viewport */
    .profile-card{
      background:var(--white);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
    }
    .profile-range{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:8px;
      margin-top:12px;
    }
    .profile-range > div{min-width:0}
    .profile-range label{
      font-size:.72rem;
      margin-bottom:5px;
      color:#526250;
    }
    .profile-range .compact-field{
      width:100%;
      min-width:0;
      max-width:100%;
      height:46px;
      padding:8px 5px;
      text-align:center;
      font-size:1rem;
      font-weight:700;
      border:1px solid #cbd6c4;
      border-radius:10px;
      background:white;
      color:var(--ink);
      outline:none;
    }
    .profile-range .compact-field:focus{
      border-color:var(--forest);
      box-shadow:0 0 0 3px rgba(53,91,56,.09);
    }
    .profile-range .fixed-symbol{
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:default;
      background:#eef2e9;
      color:var(--forest);
    }
    .profile-range .compact-field::-webkit-inner-spin-button,
    .profile-range .compact-field::-webkit-outer-spin-button{
      margin:0;
    }
    .profile-actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:14px;
    }
    .regional-targets{
      display:grid;
      gap:10px;
      margin-top:14px;
    }
    .regional-target-card{
      background:#fbfcf9;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
    }
    .regional-target-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:10px;
    }
    .regional-target-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;
    }
    .regional-target-item{
      min-width:0;
      background:white;
      border:1px solid #e1e7dc;
      border-radius:10px;
      padding:8px;
    }
    .regional-target-item label{
      display:block;
      font-size:.68rem;
      line-height:1.2;
      color:#526250;
      margin-bottom:5px;
    }
    .regional-target-input{
      width:100%;
      height:40px;
      border:1px solid #cbd6c4;
      border-radius:9px;
      background:#fff;
      color:var(--ink);
      text-align:center;
      font-size:.95rem;
      font-weight:700;
      outline:none;
      box-sizing:border-box;
    }
    .regional-target-input:focus{
      border-color:var(--forest);
      box-shadow:0 0 0 3px rgba(53,91,56,.09);
    }
    .online-offline-row{
      background:#fbfcf9;
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
    }
    .quota-box{
      border:1px solid #e1e7dc;
      border-radius:10px;
      padding:9px;
      display:grid;
      gap:2px;
    }
    .online-box{background:#f2f8f8}
    .offline-box{background:#f7f8f4}
    .quota-box b{font-size:1rem}

    .profile-summary{
      display:grid;
      gap:9px;
      margin-top:12px;
    }
    .profile-summary .row{
      min-width:0;
      padding:9px 0;
      border-bottom:1px solid #edf1e9;
    }
    .profile-summary .row:last-child{border-bottom:0}
    .profile-summary span,.profile-summary b{
      min-width:0;
      overflow-wrap:anywhere;
    }
    @media(max-width:380px){
      .profile-range{gap:6px}
      .profile-range .compact-field{height:43px;font-size:.95rem;padding-left:3px;padding-right:3px}
    }
    @media(min-width:520px){
      .profile-actions{grid-template-columns:1fr 1.4fr}
    }
    @media(min-width:800px){
      .sidebar{display:flex}
      .main{padding-bottom:0}
      .bottom-nav{display:none}
      .stats{grid-template-columns:repeat(6,minmax(0,1fr))}
      .header-inner,.page{padding-left:28px;padding-right:28px}
    }
  </style>
</head>

<body>
<div class="app">
  <aside class="sidebar">
    <div style="font-weight:700;font-size:1.1rem;margin-bottom:28px">RIMBA Tracker</div>
    <div id="desktopNav"></div>
    <div style="margin-top:auto;font-size:.75rem;color:#dce8d8">
      Koridor RIMBA · Enumerator
    </div>
  </aside>

  <div class="main">
    <header>
      <div class="header-inner">
        <div class="row" style="justify-content:flex-start">
          <div class="logo" aria-label="Logo RIMBA">
            <img src="assets/rimba-logo.png" alt="Logo RIMBA">
          </div>
          <div>
            <h1 class="brand-title">RIMBA Enumerator<br><span style="font-weight:650">Tracker</span></h1>
            <p class="muted brand-subtitle" id="headerGreeting">Rohil Inhil Medan Batam</p>
          </div>
        </div>

      </div>
    </header>

    <main id="view" class="page"></main>
  </div>
</div>

<nav id="bottomNav" class="bottom-nav"></nav>
<div id="toast" class="toast"></div>

<script>
const DEFAULT_CONFIG = {
  name: "",
  allocations: {
    "Masyarakat": {code:"M", start:null, end:null},
    "Pemuda": {code:"P", start:null, end:null},
    "Akademisi": {code:"A", start:null, end:null},
    "Bisnis/UMKM": {code:"B", start:null, end:null},
    "Instansi Pemerintahan": {code:"I", start:null, end:null},
    "LSM/NGO": {code:"L", start:null, end:null}
  },
  regionalTargets: {
    "Pekanbaru": {"Masyarakat":null,"Pemuda":null,"Akademisi":null,"Bisnis/UMKM":null,"Instansi Pemerintahan":null,"LSM/NGO":null},
    "Kampar": {"Masyarakat":null,"Pemuda":null,"Akademisi":null,"Bisnis/UMKM":null,"Instansi Pemerintahan":null,"LSM/NGO":null},
    "Kuantan Singingi": {"Masyarakat":null,"Pemuda":null,"Akademisi":null,"Bisnis/UMKM":null,"Instansi Pemerintahan":null,"LSM/NGO":null},
    "Indragiri Hulu": {"Masyarakat":null,"Pemuda":null,"Akademisi":null,"Bisnis/UMKM":null,"Instansi Pemerintahan":null,"LSM/NGO":null}
  },
  onlineTargets: {
    "Masyarakat":null,"Pemuda":null,"Akademisi":null,"Bisnis/UMKM":null,"Instansi Pemerintahan":null,"LSM/NGO":null
  }
};

let storageAvailable=true;
function storageGet(key, fallback=null){
  try{
    const raw=localStorage.getItem(key);
    return raw===null?fallback:JSON.parse(raw);
  }catch(e){ storageAvailable=false; return fallback; }
}
function storageSet(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    storageAvailable=true;
    return true;
  }catch(e){ storageAvailable=false; return false; }
}
try{
  const testKey="__rimba_storage_test__";
  localStorage.setItem(testKey,"1");
  localStorage.removeItem(testKey);
}catch(e){ storageAvailable=false; }

let appConfig = storageGet("rimba_config", null) || JSON.parse(JSON.stringify(DEFAULT_CONFIG));
if(!appConfig.regionalTargets){
  appConfig.regionalTargets=JSON.parse(JSON.stringify(DEFAULT_CONFIG.regionalTargets));
}
if(!appConfig.onlineTargets){
  appConfig.onlineTargets=JSON.parse(JSON.stringify(DEFAULT_CONFIG.onlineTargets));
}
let TARGETS = buildTargets();

function buildTargets(){
  const out={};
  Object.entries(appConfig.allocations).forEach(([category,a])=>{
    const start=Number(a.start), end=Number(a.end);
    const configured=Number.isInteger(start) && Number.isInteger(end) && start>=1 && end>=start;
    const regions={};
    regionsList().forEach(region=>{
      const raw=appConfig.regionalTargets?.[region]?.[category];
      regions[region]=(raw===null || raw===undefined || raw==="") ? null : Math.max(0,Number(raw)||0);
    });
    const regionalValues=Object.values(regions).filter(v=>Number.isInteger(v));
    const regionalConfigured=regionalValues.length>0;
    const targetTotal=regionalConfigured ? regionalValues.reduce((sum,v)=>sum+v,0) : 0;
    const total=configured?end-start+1:0;
    const onlineRaw=appConfig.onlineTargets?.[category];
    const onlineTarget=(onlineRaw===null || onlineRaw===undefined || onlineRaw==="") ? null : Math.max(0,Math.min(total,Number(onlineRaw)||0));
    out[category]={
      code:String(a.code||DEFAULT_CONFIG.allocations[category].code).trim().toUpperCase(),
      start:configured?start:null,
      total,
      targetTotal,
      onlineTarget,
      offlineTarget:onlineTarget===null?null:Math.max(0,total-onlineTarget),
      end:configured?end:null,
      regions
    };
  });
  return out;
}

function regionsList(){return ["Pekanbaru","Kampar","Kuantan Singingi","Indragiri Hulu"]}
function totalTarget(){return Object.values(TARGETS).reduce((sum,t)=>sum+t.targetTotal,0)}
function categoryTarget(category){return TARGETS[category]?.targetTotal||0}
function onlineCount(category){return records.filter(r=>r.category===category&&r.method==="Online").length}
function offlineCount(category){return records.filter(r=>r.category===category&&r.method==="Offline").length}
function saveConfig(){return storageSet("rimba_config",appConfig)}
function updateHeaderName(){const el=document.getElementById("headerGreeting"); if(el) el.textContent=appConfig.name ? "Selamat Bertugas, "+appConfig.name : "Rohil Inhil Medan Batam"}
function resetConfig(){
  appConfig=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  TARGETS=buildTargets();
  saveConfig();
}


const regions = ["Pekanbaru","Kampar","Kuantan Singingi","Indragiri Hulu"];

const districts = {
  "Pekanbaru":["Pekanbaru Kota","Payung Sekaki","Sukajadi","Senapelan","Limapuluh","Sail","Marpoyan Damai","Bukit Raya","Tenayan Raya","Bina Widya","Tuah Madani","Rumbai","Rumbai Barat","Rumbai Timur","Kulim"],
  "Kampar":["XIII Koto Kampar","Kuok","Salo","Kampar Kiri","Kampar Kiri Hulu"],
  "Kuantan Singingi":["Singingi Hilir","Singingi","Hulu Kuantan","Kuantan Mudik","Pucuk Rantau"],
  "Indragiri Hulu":["Batang Peranap","Peranap","Batang Cenaku","Batang Gangsal"]
};

const categories = Object.keys(TARGETS);
const statuses = ["Selesai","Belum Selesai"];

let records = storageGet("rimba_records", []) || [];
let view = "dashboard";
let editingId = null;
let detailId = null;
let pendingPhotos = [];

function saveData(){
  return storageSet("rimba_records",records);
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}

function completed(r){return r.status==="Selesai"}

function qnums(category){
  const t=TARGETS[category];
  if(!t || !t.total || t.start===null) return [];
  return Array.from({length:t.total},(_,i)=>`${t.code} - ${t.start+i}`);
}

function nextQ(category, ignoreId=null){
  return qnums(category).find(q =>
    !records.some(r => r.questionnaire_number===q && r.id!==ignoreId)
  ) || "";
}

function countDone(category){
  return records.filter(r=>r.category===category && completed(r)).length;
}

function statusBadge(status){
  return `<span class="badge ${status==="Selesai"?"done":"pending"}">${status}</span>`;
}

const nav = [
  ["dashboard","Dashboard","home"],
  ["respondents","Responden","users"],
  ["numbers","Kuesioner","file"],
  ["progress","Progres","chart"],
  ["more","Lainnya","menu"]
];

function icon(name){
  const common='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const paths={

function customSelect(id, options, value="", placeholder="Pilih", onChange=""){
  const normalized=options.map(o=>typeof o==="string"?{value:o,label:o}:o);
  const selected=normalized.find(o=>o.value===value);
  const label=selected?.label || placeholder;
  return `<div class="custom-select" id="wrap_${id}" data-select-id="${id}">
    <input type="hidden" id="${id}" value="${escapeHtml(value||"")}">
    <button type="button" class="custom-select-button" onclick="toggleCustomSelect('${id}',event)">
      <span id="label_${id}">${escapeHtml(label)}</span><span class="select-chevron"></span>
    </button>
    <div class="custom-select-menu" id="menu_${id}">
      ${normalized.length ? normalized.map(o=>customOptionHtml(id,o,value)).join("") : `<div class="muted tiny" style="padding:12px">Belum ada pilihan.</div>`}
    </div>
  </div>`;
}

function customOptionHtml(id,o,current){
  const disabled=o.disabled?"disabled":"";
  const selected=o.value===current?"selected":"";
  const meta=o.meta?`<span class="option-meta">${escapeHtml(o.meta)}</span>`:"";
  const valueAttr=escapeHtml(String(o.value));
  return `<button type="button" class="custom-option ${selected} ${disabled}" data-select-id="${escapeHtml(id)}" data-value="${valueAttr}" ${o.disabled?"disabled":""}>${escapeHtml(o.label)}${meta}</button>`;
}

function toggleCustomSelect(id,e){
  if(e){e.preventDefault();e.stopPropagation();}
  const wrap=document.getElementById(`wrap_${id}`);
  if(!wrap)return;
  const wasOpen=wrap.classList.contains("open");
  document.querySelectorAll(".custom-select.open").forEach(el=>el.classList.remove("open"));
  if(!wasOpen)wrap.classList.add("open");
}

function closeCustomSelects(){
  document.querySelectorAll(".custom-select.open").forEach(el=>el.classList.remove("open"));
}

// Tangani pilihan dengan event delegation agar tetap bisa ditekan di Android/touch.
document.addEventListener("click",(e)=>{
  const option=e.target.closest?.(".custom-option");
  if(option && !option.disabled){
    e.preventDefault();
    e.stopPropagation();
    chooseCustomOption(option.dataset.selectId,option.dataset.value,e,option);
    return;
  }
  if(!e.target.closest?.(".custom-select")) closeCustomSelects();
});

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCustomSelects()});

let lastSelectKey="";
let lastSelectAt=0;
function chooseCustomOption(id,value,e,optionEl=null){
  if(e){e.preventDefault();e.stopPropagation();}
  const selectKey=id+"\u0000"+String(value);
  const now=Date.now();
  if(selectKey===lastSelectKey && now-lastSelectAt<450)return;
  lastSelectKey=selectKey;
  lastSelectAt=now;
  const input=document.getElementById(id);
  const wrap=document.getElementById(`wrap_${id}`);
  if(!input || !wrap)return;
  input.value=value;
  const option=optionEl || wrap.querySelector(`.custom-option[data-value="${CSS.escape(String(value))}"]`);
  const labelEl=document.getElementById(`label_${id}`);
  if(labelEl)labelEl.textContent=option ? (option.childNodes[0]?.textContent?.trim()||value) : value;
  wrap.querySelectorAll(".custom-option").forEach(o=>o.classList.remove("selected"));
  if(option)option.classList.add("selected");
  wrap.classList.remove("open");
  const callbacks={
    fcat:renderList,freg:renderList,fstat:renderList,fmeth:renderList,
    category:updateQuestionnaires,region:updateDistricts
  };
  if(callbacks[id])callbacks[id]();
}

function setCustomOptions(id,options,value="",placeholder="Pilih"){
  const wrap=document.getElementById(`wrap_${id}`);
  const input=document.getElementById(id);
  const menu=document.getElementById(`menu_${id}`);
  const labelEl=document.getElementById(`label_${id}`);
  if(!wrap||!input||!menu||!labelEl)return;
  const normalized=options.map(o=>typeof o==="string"?{value:o,label:o}:o);
  const selected=normalized.find(o=>o.value===value);
  const finalValue=selected?.value||"";
  input.value=finalValue;
  labelEl.textContent=selected?.label||placeholder;
  menu.innerHTML=normalized.length?normalized.map(o=>customOptionHtml(id,o,finalValue)).join(""):`<div class="muted tiny" style="padding:12px">Belum ada pilihan.</div>`;
}

function updateQuestionnaires(){
  const category=document.getElementById("category")?.value||"";
  const current=editingId ? records.find(r=>r.id===editingId)?.questionnaire_number : null;
  const options=qnums(category).map(q=>({value:q,label:q,disabled:records.some(r=>r.questionnaire_number===q && r.id!==editingId),meta:records.some(r=>r.questionnaire_number===q && r.id!==editingId)?"Terpakai":""}));
  const selected=current || nextQ(category);
  setCustomOptions("questionnaire", options, selected, "Pilih nomor");
}

function saveRecord(e){
  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const category=document.getElementById("category").value;
  const method=document.getElementById("method").value;
  const q=document.getElementById("questionnaire").value;
  const status=document.getElementById("status").value || "Selesai";

  if(!name){toast("Nama responden wajib diisi."); return;}
  if(!category){toast("Kategori wajib dipilih."); return;}
  if(!method){toast("Metode wajib dipilih."); return;}
  if(!q){toast("Nomor kuesioner wajib dipilih. Atur nomor terlebih dahulu di menu Saya."); return;}
  if(!status){toast("Status wajib dipilih."); return;}

  if(records.some(r=>r.questionnaire_number===q && r.id!==editingId)){
    toast("Nomor kuesioner sudah digunakan.");
    return;
  }

  const old=editingId ? records.find(r=>r.id===editingId) : null;

  const record={
    id:editingId||uid(),
    name:name,
    contact:document.getElementById("contact").value.trim(),
    category:category,
    region:document.getElementById("region").value,
    district:document.getElementById("district").value,
    village:document.getElementById("village").value.trim(),
    method:method,
    questionnaire_number:q,
    status:status,
    date:document.getElementById("date").value,
    notes:document.getElementById("notes").value.trim(),
    photos:[...(old?.photos||[]), ...pendingPhotos]
  };

  if(old){
    records=records.map(r=>r.id===editingId?record:r);
  }else{
    records.push(record);
  }

function imageToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1400;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",0.78));
      };
      img.onerror=()=>reject(new Error("Gagal membaca gambar"));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(reader.error||new Error("Gagal membaca file"));
    reader.readAsDataURL(file);
  });
}

async function addFormPhotos(e){
  const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith("image/"));
  if(!files.length)return;
  try{
    const converted=await Promise.all(files.map(imageToDataURL));
    pendingPhotos.push(...converted);
    const r=editingId?records.find(x=>x.id===editingId):null;
    const preview=document.getElementById("formPhotoPreview");
    if(preview)preview.innerHTML=renderFormPhotoPreview(r?.photos||[]);
    toast(`${converted.length} foto ditambahkan.`);
  }catch(err){
    toast("Ada foto yang gagal dibaca.");
  }
  e.target.value="";
}

async function addPhoto(e,id){
  const files=Array.from(e.target.files||[]).filter(f=>f.type.startsWith("image/"));
  if(!files.length)return;
  const r=records.find(x=>x.id===id);
  if(!r)return;
  r.photos=Array.isArray(r.photos)?r.photos:[];
  try{
    const converted=await Promise.all(files.map(imageToDataURL));
    r.photos.push(...converted);
    saveData();
    toast(`${converted.length} foto ditambahkan.`);
    render();
  }catch(err){
    toast("Ada foto yang gagal dibaca.");
  }
  e.target.value="";
}

function saveProfile(){
  const oldRecords=[...records];
  const next={name:(document.getElementById("profileName").value||"Enumerator").trim(),allocations:{},regionalTargets:{},onlineTargets:{}};
  const seen=new Set();
  for(let i=0;i<categories.length;i++){
    const c=categories[i];
    const code=DEFAULT_CONFIG.allocations[c].code;
    const startRaw=document.getElementById(`start_${i}`).value.trim();
    const endRaw=document.getElementById(`end_${i}`).value.trim();
    if(!startRaw || !endRaw){ toast(`Nomor ${c} belum lengkap.`); return; }
    const start=Number(startRaw);
    const end=Number(endRaw);
    if(!Number.isInteger(start) || !Number.isInteger(end) || start<1 || end<start || start>999 || end>999){
      toast("Nomor harus 1–999 dan nomor awal tidak boleh lebih besar dari nomor akhir."); return;
    }
    for(let n=start;n<=end;n++){
      const q=`${code} - ${n}`;
      if(seen.has(q)){toast(`Nomor bentrok: ${q}`); return;}
      seen.add(q);
    }
    next.allocations[c]={code,start,end};
  }

  categories.forEach((c,i)=>{
    const raw=document.getElementById(`online_${i}`)?.value.trim()||"";
    if(raw===""){ next.onlineTargets[c]=null; return; }
    const value=Number(raw);
    const total=Number(next.allocations[c].end)-Number(next.allocations[c].start)+1;
    if(!Number.isInteger(value) || value<0 || value>total){
      toast(`Jatah online ${c} harus 0–${total}.`);
      next._invalid=true;
      return;
    }
    next.onlineTargets[c]=value;
  });
  if(next._invalid){ delete next._invalid; return; }

  regionsList().forEach((region,ri)=>{
    next.regionalTargets[region]={};
    categories.forEach((c,ci)=>{
      const raw=document.getElementById(`rt_${ri}_${ci}`)?.value.trim()||"";
      if(raw===""){
        next.regionalTargets[region][c]=null;
        return;
      }
      const value=Number(raw);
      if(!Number.isInteger(value) || value<0 || value>999){
        toast(`Target ${c} di ${region} harus 0–999.`);
        next._invalid=true;
        return;
      }
      next.regionalTargets[region][c]=value;
    });
  });

  if(next._invalid){ delete next._invalid; return; }

  const allowed=seen;
  const orphan=oldRecords.find(r=>r.questionnaire_number && !allowed.has(r.questionnaire_number));
  if(orphan){
    toast(`Tidak bisa disimpan: nomor ${orphan.questionnaire_number} sudah dipakai.`); return;
  }

  appConfig=next;
  TARGETS=buildTargets();
  saveConfig();
  toast("Pengaturan berhasil disimpan.");
  updateHeaderName();
  render();
}

function exportCSV(){
  const keys=["name","contact","category","region","district","village","method","questionnaire_number","status","date","notes"];
  const headers=["Nama","Kontak","Kategori","Wilayah","Kecamatan","Desa/Kelurahan","Metode","Nomor Kuesioner","Status","Tanggal","Catatan"];
  const configJSON=JSON.stringify(appConfig);
  const rows=[
    ["#RIMBA_VERSION","2"],
    ["#RIMBA_CONFIG",configJSON],
    [],
    headers,
    ...records.map(r=>keys.map(k=>r[k]||""))
  ];
  const csv=rows.map(row=>row.map(csvCell).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="rimba-backup.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup lengkap berhasil dibuat.");
}

function parseCSV(text){
  text=String(text||"").replace(/^\ufeff/,"");
  // Kompatibel dengan export lama yang menyimpan karakter \\n sebagai teks literal.
  if(!text.includes("\n") && text.includes("\\n")) text=text.replace(/\\n/g,"\n");
  const rows=[];
  let row=[],cell="",quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){
      if(ch==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else quoted=false;
      }else cell+=ch;
    }else{
      if(ch==='"') quoted=true;
      else if(ch===','){row.push(cell);cell="";}
      else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell="";}
      else if(ch!=='\r') cell+=ch;
    }
  }
  if(cell!=="" || row.length){row.push(cell);rows.push(row);}
  return rows;
}

function normalizeImportedConfig(cfg){
  if(!cfg || typeof cfg!=="object" || !cfg.allocations) return null;
  const clean={name:String(cfg.name||"Enumerator").trim(),allocations:{},regionalTargets:{},onlineTargets:{}};
  for(const c of categories){
    const a=cfg.allocations[c];
    if(!a) return null;
    const start=Number(a.start), end=Number(a.end);
    if(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start||end>999) return null;
    clean.allocations[c]={code:String(a.code||DEFAULT_CONFIG.allocations[c].code).trim().toUpperCase(),start,end};
    const ot=cfg.onlineTargets?.[c];
    clean.onlineTargets[c]=(ot===null||ot===undefined||ot==="")?null:Math.max(0,Math.min(end-start+1,Number(ot)||0));
  }
  for(const region of regionsList()){
    clean.regionalTargets[region]={};
    for(const c of categories){
      const v=cfg.regionalTargets?.[region]?.[c];
      clean.regionalTargets[region][c]=(v===null||v===undefined||v==="")?null:Math.max(0,Number(v)||0);
    }
  }
  return clean;
}

function importCSV(e){
  const file=e.target.files?.[0];
  e.target.value="";
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const rows=parseCSV(String(reader.result||""));
      if(!rows.length)throw new Error("CSV kosong.");

      let importedConfig=null;
      let headerIndex=-1;
      // Cari metadata dan header tanpa bergantung pada posisi persisnya.
      for(let i=0;i<Math.min(rows.length,20);i++){
        if(rows[i][0]==="#RIMBA_CONFIG"){
          try{ importedConfig=JSON.parse(rows[i][1]||"{}"); }catch(_){ importedConfig=null; }
        }
        if(rows[i].includes("Nama") && rows[i].includes("Kategori") && rows[i].includes("Nomor Kuesioner")){
          headerIndex=i;
          break;
        }
      }
      if(headerIndex<0)throw new Error("Format CSV RIMBA tidak dikenali.");

      const headers=rows[headerIndex].map(h=>String(h||"").trim());
      const index={};
      headers.forEach((h,i)=>index[h]=i);
      if(index["Nama"]===undefined || index["Kategori"]===undefined || index["Nomor Kuesioner"]===undefined){
        throw new Error("Kolom wajib CSV RIMBA tidak lengkap.");
      }
      const col=(...names)=>{for(const n of names){if(index[n]!==undefined)return index[n]}return undefined};
      const iContact=col("Kontak","Nomor HP/Kontak","Nomor HP/kontak");
      const iRegion=col("Wilayah","Kabupaten/Kota","Kabupaten/kota");
      const iDistrict=col("Kecamatan");
      const iVillage=col("Desa/Kelurahan","Desa/kelurahan");
      const iMethod=col("Metode");
      const iStatus=col("Status");
      const iDate=col("Tanggal","Tanggal Pengisian","Tanggal pengisian");
      const iNotes=col("Catatan");

      const imported=[];
      const used=new Set();
      for(let i=headerIndex+1;i<rows.length;i++){
        const row=rows[i];
        if(!row.length || row.every(v=>String(v||"").trim()===""))continue;
        const name=String(row[index["Nama"]]||"").trim();
        if(!name)continue;
        const category=String(row[index["Kategori"]]||"").trim();
        if(!categories.includes(category))throw new Error(`Kategori tidak dikenali: ${category||"(kosong)"}`);
        const q=String(row[index["Nomor Kuesioner"]]||"").trim();
        if(q && used.has(q))throw new Error(`Nomor kuesioner ganda di CSV: ${q}`);
        if(q)used.add(q);
        imported.push({
          id:uid(), name,
          contact:iContact!==undefined?String(row[iContact]||"").trim():"",
          category,
          region:iRegion!==undefined?String(row[iRegion]||"").trim():"",
          district:iDistrict!==undefined?String(row[iDistrict]||"").trim():"",
          village:iVillage!==undefined?String(row[iVillage]||"").trim():"",
          method:iMethod!==undefined?(String(row[iMethod]||"").trim()||"Offline"):"Offline",
          questionnaire_number:q,
          status:iStatus!==undefined?(String(row[iStatus]||"").trim()||"Selesai"):"Selesai",
          date:iDate!==undefined?String(row[iDate]||"").trim():"",
          notes:iNotes!==undefined?String(row[iNotes]||"").trim():"",
          photos:[]
        });
      }

      const cleanConfig=normalizeImportedConfig(importedConfig);
      const hasConfig=!!cleanConfig;
      if(hasConfig) appConfig=cleanConfig;

      const currentRanges=buildTargets();
      const configToCheck=hasConfig?cleanConfig:appConfig;
      for(const r of imported){
        const t=configToCheck.allocations[r.category];
        if(!t)throw new Error(`Pengaturan nomor untuk ${r.category} tidak ditemukan.`);
        const m=new RegExp(`^${String(t.code).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')} - (\\d+)$`).exec(r.questionnaire_number);
        if(!m)throw new Error(`Nomor ${r.questionnaire_number} tidak sesuai rentang ${r.category}.`);
        const n=Number(m[1]);
        if(n<t.start||n>t.end)throw new Error(`Nomor ${r.questionnaire_number} berada di luar rentang ${t.code} - ${t.start} s/d ${t.end}.`);
      }

      if(!confirm(`Import ${imported.length} responden${hasConfig?" dan seluruh pengaturan aplikasi":""}? Data responden yang sekarang di perangkat ini akan diganti.`))return;
      records=imported;
      TARGETS=buildTargets();
      saveData();
      saveConfig();
      updateHeaderName();
      render();
      toast(hasConfig?`Berhasil import ${imported.length} responden + pengaturan.`:`Berhasil import ${imported.length} responden.`);
    }catch(err){
      toast(err?.message||"CSV tidak dapat diimport.");
    }
  };
  reader.readAsText(file,"UTF-8");
}

function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function render(){
  renderNav();

  const views={
    dashboard,
    respondents,
    form,
    detail,
    numbers,
    progress,
    more,
    profile
  };

  document.getElementById("view").innerHTML=views[view]();

  if(view==="respondents")renderList();

  if(view==="form"){
    updateDistricts();
    updateQuestionnaires();
  }
}

render();
updateHeaderName();
</script>
